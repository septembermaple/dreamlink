# Server Configuration
server:
  port: 8080

# H2 Database Configuration
spring:
  datasource:
    url: jdbc:h2:mem:dreamlink
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

# JWT Configuration
jwt:
  secret: dreamlink-secret-key-for-jwt-token-generation-and-validation-2024
  expiration: 86400000  # 24小时

